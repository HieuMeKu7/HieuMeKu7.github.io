<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Gửi Mẫn — một câu chuyện kể bằng 20 cảnh chat, dành tặng sinh nhật 20 tuổi.">
<meta name="theme-color" content="#e91e63">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
<title>Gửi Mẫn 💌</title>
<style>
:root{
  --page-bg: linear-gradient(160deg,#fde5ee 0%,#e8e4f8 55%,#dcefff 100%);
  --phone-bg:#ffffff;
  --header-bg:rgba(255,255,255,.88);
  --text:#050505;
  --text-dim:#65676b;
  --bubble-in:#eef0f3;
  --bubble-in-text:#050505;
  --divider:#e3e5e9;
  --composer-bg:#f1f3f5;
  --accent:#e91e63;
  --accent-soft:#fce4ec;
  --out-grad:linear-gradient(135deg,#ff4f8b 0%,#e91e63 100%);
  --shadow:0 24px 60px rgba(60,30,80,.25);
}
[data-theme="shop"]{
  --accent:#0084ff;
  --accent-soft:#e3f0ff;
  --out-grad:linear-gradient(135deg,#00a6ff 0%,#0066ff 100%);
}
@media (prefers-color-scheme: dark){
  :root{
    --page-bg: linear-gradient(160deg,#241522 0%,#171226 55%,#0e1a2b 100%);
    --phone-bg:#101418;
    --header-bg:rgba(16,20,24,.88);
    --text:#e7e9ec;
    --text-dim:#9aa0a8;
    --bubble-in:#262b31;
    --bubble-in-text:#e7e9ec;
    --divider:#23282e;
    --composer-bg:#1c2126;
    --shadow:0 24px 60px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--page-bg);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

/* ============ Phone frame ============ */
.phone{
  position:relative;
  width:min(430px,100vw);
  height:min(880px,100dvh);
  background:var(--phone-bg);
  border-radius:28px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;flex-direction:column;
}
@media (max-width:480px),(max-height:700px){
  .phone{width:100vw;height:100dvh;border-radius:0}
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:1;transition:opacity .45s ease, transform .45s ease;
}
.screen.gone{opacity:0;pointer-events:none;transform:scale(.98)}

/* ============ Intro screen ============ */
.intro{
  align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(165deg,#ff5e9c 0%,#e91e63 45%,#7b2ff7 100%);
  color:#fff;padding:32px;z-index:5;
}
.intro .floaters span{
  position:absolute;font-size:26px;opacity:.5;animation:floaty 7s ease-in-out infinite;
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotate(-6deg)}
  50%{transform:translateY(-26px) rotate(8deg)}
}
.intro-card{position:relative;max-width:320px}
.intro-ava{
  width:104px;height:104px;border-radius:50%;object-fit:cover;
  border:4px solid rgba(255,255,255,.85);
  box-shadow:0 10px 34px rgba(0,0,0,.3);
  animation:pulse-ring 2.6s ease-in-out infinite;
}
@keyframes pulse-ring{
  0%,100%{box-shadow:0 10px 34px rgba(0,0,0,.3),0 0 0 0 rgba(255,255,255,.45)}
  50%{box-shadow:0 10px 34px rgba(0,0,0,.3),0 0 0 18px rgba(255,255,255,0)}
}
.intro h1{margin:22px 0 8px;font-size:2rem;letter-spacing:.5px}
.intro p{margin:0 0 26px;font-size:1rem;line-height:1.55;opacity:.92}
.intro .hint{font-size:.8rem;opacity:.75;margin-top:16px}
.btn-open{
  background:#fff;color:#e91e63;border:none;cursor:pointer;
  font-size:1.05rem;font-weight:700;padding:14px 34px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn-open:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.btn-open:active{transform:translateY(0)}

/* ============ Chat screen ============ */
.chat{background:var(--phone-bg)}
.chat-header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px calc(8px);
  padding-top:max(10px, env(safe-area-inset-top));
  background:var(--header-bg);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--divider);
  flex-shrink:0;z-index:3;
}
.ava-wrap{position:relative;flex-shrink:0}
.header-ava{width:40px;height:40px;border-radius:50%;object-fit:cover;transition:opacity .3s}
.online-dot{
  position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;
  background:#31cc46;border:2px solid var(--phone-bg);
}
.header-meta{flex:1;min-width:0;text-align:left}
.header-name{
  font-weight:700;font-size:1rem;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .3s;
}
.header-name.flip{animation:name-flip .5s ease}
@keyframes name-flip{
  0%{transform:translateY(0);opacity:1}
  45%{transform:translateY(-9px);opacity:0}
  55%{transform:translateY(9px);opacity:0}
  100%{transform:translateY(0);opacity:1}
}
.header-status{font-size:.74rem;color:var(--text-dim);line-height:1.3}
.icon-btn{
  background:none;border:none;cursor:pointer;font-size:1.15rem;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--accent);transition:background .2s;
}
.icon-btn:hover{background:var(--accent-soft)}

/* story-style scene progress */
.progress{
  display:flex;gap:3px;padding:6px 12px 5px;flex-shrink:0;
  background:var(--header-bg);border-bottom:1px solid var(--divider);
}
.progress i{
  flex:1;height:3px;border-radius:2px;background:var(--divider);
  overflow:hidden;position:relative;
}
.progress i::after{
  content:"";position:absolute;inset:0;background:var(--accent);
  transform:scaleX(0);transform-origin:left;transition:transform .5s ease;
}
.progress i.done::after{transform:scaleX(1)}

/* messages */
.chat-body{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;position:relative;
}
.msgs{display:none;flex-direction:column;padding:14px 12px 10px;min-height:100%}
.msgs.active{display:flex}
.row{display:flex;margin:1px 0;animation:msg-in .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msg-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.row.in{justify-content:flex-start}
.row.out{justify-content:flex-end}
.row .side{width:28px;flex-shrink:0;display:flex;align-items:flex-end;margin-right:8px}
.side img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.bubble{
  position:relative;max-width:72%;
  padding:8px 13px;border-radius:18px;
  font-size:.95rem;line-height:1.42;
  overflow-wrap:anywhere;white-space:pre-wrap;
}
.row.in .bubble{background:var(--bubble-in);color:var(--bubble-in-text)}
.row.out .bubble{background:var(--out-grad);color:#fff}
/* messenger-style group radii */
.row.in.g-first .bubble{border-bottom-left-radius:5px}
.row.in.g-mid .bubble{border-top-left-radius:5px;border-bottom-left-radius:5px}
.row.in.g-last .bubble{border-top-left-radius:5px}
.row.out.g-first .bubble{border-bottom-right-radius:5px}
.row.out.g-mid .bubble{border-top-right-radius:5px;border-bottom-right-radius:5px}
.row.out.g-last .bubble{border-top-right-radius:5px}
.bubble em{font-style:italic;opacity:.85}
.bubble img.media{
  display:block;max-width:100%;border-radius:12px;margin:6px -3px 0;
  cursor:zoom-in;
}
.bubble.media-only{padding:3px;background:none !important}
.bubble.media-only img.media{margin:0}
.bubble video{display:block;width:100%;max-width:260px;border-radius:12px;margin:6px -3px 0;background:#000}
.row.has-react{margin-bottom:16px}
.react-badge{
  position:absolute;bottom:-11px;font-size:.78rem;line-height:1;
  background:var(--phone-bg);border:1px solid var(--divider);
  border-radius:999px;padding:2.5px 5px;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
  animation:react-pop .45s cubic-bezier(.2,1.6,.4,1);
}
.row.out .react-badge{left:-4px}
.row.in .react-badge{right:-4px}
@keyframes react-pop{from{transform:scale(0)}to{transform:scale(1)}}
.seen-row{
  display:flex;justify-content:flex-end;padding:3px 4px 0;
  animation:msg-in .3s ease;
}
.seen-row img{width:15px;height:15px;border-radius:50%;object-fit:cover}
.seen-row span{font-size:.68rem;color:var(--text-dim);margin-right:5px;align-self:center}

/* payment card */
.pay-card{
  background:linear-gradient(135deg,#a50064 0%,#d82d8b 100%);
  color:#fff;border-radius:16px;padding:13px 16px;min-width:180px;
  white-space:normal;
}
.pay-card .pay-top{display:flex;align-items:center;gap:8px;font-size:.8rem;opacity:.9}
.pay-card .pay-amount{font-size:1.5rem;font-weight:800;margin:5px 0 2px}
.pay-card .pay-note{font-size:.75rem;opacity:.85;font-style:italic}

/* system / narrator / dividers */
.sys{
  align-self:center;text-align:center;max-width:86%;
  font-size:.76rem;color:var(--text-dim);
  margin:10px 0;animation:msg-in .3s ease;
}
.sys .sys-ava{
  display:block;width:66px;height:66px;border-radius:50%;object-fit:cover;
  margin:8px auto 0;border:3px solid var(--accent-soft);
}
.narrator{
  align-self:center;text-align:center;max-width:88%;
  font-size:.83rem;font-style:italic;line-height:1.5;color:var(--text-dim);
  background:var(--accent-soft);border-radius:14px;padding:10px 16px;
  margin:12px 0;animation:msg-in .35s ease;
}
.divider{
  align-self:center;display:flex;align-items:center;gap:8px;
  margin:16px 0 8px;animation:msg-in .3s ease;
}
.divider b{
  font-size:.72rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);
  border-radius:999px;padding:4px 12px;
}
/* typing indicator */
.typing .bubble{display:flex;gap:4px;align-items:center;padding:12px 14px}
.typing .bubble s{
  width:7px;height:7px;border-radius:50%;background:var(--text-dim);
  display:inline-block;animation:blink 1.3s infinite ease-in-out both;
}
.typing .bubble s:nth-child(2){animation-delay:.15s}
.typing .bubble s:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,70%,100%{opacity:.25;transform:scale(.8)}35%{opacity:1;transform:scale(1)}}

/* continue pill */
.continue-pill{
  position:absolute;left:50%;bottom:76px;transform:translateX(-50%);
  z-index:4;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:700;font-size:.88rem;
  padding:10px 22px;border-radius:999px;
  box-shadow:0 8px 20px rgba(0,0,0,.28);
  animation:pill-in .4s cubic-bezier(.2,1.4,.4,1), bob 2s 0.4s ease-in-out infinite;
  white-space:nowrap;
}
@keyframes pill-in{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.continue-pill.hidden{display:none}

/* composer */
.composer{
  flex-shrink:0;padding:8px 10px;
  padding-bottom:max(8px, env(safe-area-inset-bottom));
  border-top:1px solid var(--divider);background:var(--phone-bg);
}
.media-chip{
  display:none;align-items:center;gap:8px;margin:0 4px 8px;
  background:var(--composer-bg);border-radius:12px;padding:6px 10px;
  font-size:.78rem;color:var(--text-dim);
  animation:msg-in .25s ease;
}
.media-chip.show{display:flex}
.media-chip img{width:38px;height:38px;border-radius:8px;object-fit:cover}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.fake-input{
  flex:1;min-height:40px;max-height:100px;overflow:hidden;
  background:var(--composer-bg);border-radius:20px;
  padding:9px 16px;font-size:.95rem;line-height:1.45;color:var(--text);
  display:flex;align-items:center;flex-wrap:wrap;
}
.fake-input .ph{color:var(--text-dim)}
.caret{
  display:none;width:2px;height:1.1em;background:var(--accent);
  margin-left:1px;animation:caret-blink .9s steps(1) infinite;
}
.fake-input.typing-now .caret{display:inline-block}
.fake-input.typing-now .ph{display:none}
@keyframes caret-blink{50%{opacity:0}}
.send-btn{
  width:42px;height:42px;flex-shrink:0;border:none;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:var(--composer-bg);color:var(--text-dim);
  transition:background .25s,color .25s,transform .15s;
}
.send-btn svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
.send-btn:disabled{cursor:default}
.send-btn.ready{
  background:var(--accent);color:#fff;
  animation:send-pulse 1.4s ease-in-out infinite;
}
@keyframes send-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(233,30,99,.5)}
  55%{box-shadow:0 0 0 10px rgba(233,30,99,0)}
}
.send-btn.ready:active{transform:scale(.88)}

/* ============ End screen ============ */
.end{
  z-index:6;align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(165deg,#7b2ff7 0%,#e91e63 55%,#ff5e9c 100%);
  color:#fff;padding:30px;
}
.end canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.end-card{
  position:relative;max-width:330px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:24px;padding:34px 26px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
  animation:end-in .7s cubic-bezier(.2,1.2,.4,1);
}
@keyframes end-in{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.end-cake{font-size:3.4rem;display:inline-block;animation:cake-bounce 2.2s ease-in-out infinite}
@keyframes cake-bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.end h1{margin:14px 0 6px;font-size:1.55rem}
.end .sub{margin:0 0 18px;font-size:1rem;opacity:.95}
.end blockquote{
  margin:0 0 22px;font-size:.9rem;font-style:italic;line-height:1.6;
  opacity:.92;border-left:3px solid rgba(255,255,255,.6);
  padding-left:12px;text-align:left;
}
.end .sign{display:block;margin-top:8px;font-style:normal;font-weight:700;text-align:right}
.btn-replay{
  background:#fff;color:#e91e63;border:none;cursor:pointer;
  font-size:.95rem;font-weight:700;padding:12px 28px;border-radius:999px;
  box-shadow:0 8px 22px rgba(0,0,0,.25);
  transition:transform .15s ease;
}
.btn-replay:hover{transform:translateY(-2px)}

/* lightbox for photos */
.lightbox{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(0,0,0,.9);cursor:zoom-out;
  align-items:center;justify-content:center;padding:20px;
}
.lightbox.show{display:flex;animation:msg-in .2s ease}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .chat-body{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- ===== Intro ===== -->
  <section class="screen intro" id="introScreen">
    <div class="floaters" aria-hidden="true">
      <span style="top:8%;left:12%">💌</span>
      <span style="top:16%;right:14%;animation-delay:-2s">🎂</span>
      <span style="bottom:22%;left:10%;animation-delay:-4s">🎈</span>
      <span style="bottom:12%;right:16%;animation-delay:-1s">💖</span>
      <span style="top:42%;left:4%;animation-delay:-3s">✨</span>
      <span style="top:55%;right:5%;animation-delay:-5s">🧶</span>
    </div>
    <div class="intro-card">
      <img class="intro-ava" src="images/HueMan.jpg" alt="Mẫn">
      <h1>Gửi Mẫn 💌</h1>
      <p>Có một câu chuyện muốn kể cho mày nghe —<br>bằng <b>20 cảnh chat</b> của tụi mình 💬</p>
      <button class="btn-open" id="openBtn">Mở quà 🎁</button>
      <div class="hint">Nhớ bật loa lên nha 🔊</div>
    </div>
  </section>

  <!-- ===== Chat ===== -->
  <section class="screen chat gone" id="chatScreen" data-theme="man">
    <header class="chat-header">
      <div class="ava-wrap">
        <img class="header-ava" id="headerAva" src="images/HueMan.jpg" alt="">
        <span class="online-dot" id="onlineDot"></span>
      </div>
      <div class="header-meta">
        <div class="header-name" id="headerName">Mẫn</div>
        <div class="header-status" id="headerStatus">Đang hoạt động</div>
      </div>
      <button class="icon-btn" id="soundBtn" aria-label="Bật / tắt âm thanh">🔊</button>
    </header>
    <div class="progress" id="progressBar" aria-hidden="true"></div>

    <main class="chat-body" id="chatBody">
      <div class="msgs active" id="msgs-man" aria-live="polite"></div>
      <div class="msgs" id="msgs-shop" aria-live="polite"></div>
    </main>

    <button class="continue-pill hidden" id="continuePill">Tiếp tục ▸</button>

    <footer class="composer">
      <div class="media-chip" id="mediaChip"></div>
      <div class="composer-row">
        <div class="fake-input" id="fakeInput">
          <span class="ph">Aa</span><span id="inputText"></span><span class="caret"></span>
        </div>
        <button class="send-btn" id="sendBtn" disabled aria-label="Gửi tin nhắn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </footer>
  </section>

  <!-- ===== Ending ===== -->
  <section class="screen end gone" id="endScreen">
    <canvas id="confettiCanvas"></canvas>
    <div class="end-card">
      <span class="end-cake" aria-hidden="true">🎂</span>
      <h1>Chúc mừng sinh nhật, Mẫn!</h1>
      <p class="sub">20 tuổi rồi đó nha 🥳</p>
      <blockquote>
        “Cảm ơn mày vì đã đồng hành cùng tao 1/10 cuộc đời của mày. Mong mày giàu.”
        <span class="sign">— Hiếu ❤️</span>
      </blockquote>
      <button class="btn-replay" id="replayBtn">Xem lại từ đầu 🔄</button>
    </div>
  </section>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="Ảnh phóng to"></div>

<script>
"use strict";
/* ================================================================
   STORY DATA — the script, hand-structured. Text kept verbatim.
   Event types:
     in   – message from the conversation partner
     out  – message from Hiếu (sent by the reader via the composer)
     pay  – payment card from the partner
     sys  – small centered system line
     narr – narrator card (story aside)
     seen – "Đã xem" receipt on Hiếu's last message
     nick – partner nickname change (updates the header)
     ava  – partner avatar change (updates header + bubbles)
   Optional on in/out: img, video, react (emoji reaction badge)
   ================================================================ */
const SCENES = [
  { partner:"man", events:[
    { t:"out", text:"Mẫn à có muốn xuống D3 ngồi chơi không?" },
    { t:"in",  text:"Ko" },
  ]},
  { partner:"man", events:[
    { t:"out", text:"*đăng note* Tôi muốn chết quá đi mất" },
    { t:"in",  text:"*reply note* *Cãi lộn với Trung Hiếu 2 tiếng đồng hồ và không bao giờ nhắc tới chủ đề này nữa*" },
  ]},
  { partner:"man", events:[
    { t:"out", text:"Mẫnnnnnnnn, cho t mượn 100k được không, đói bụng quáaaa" },
    { t:"in",  text:"OK" },
    { t:"pay", amount:"99K", note:"*chuyển 99K*" },
    { t:"in",  text:"Rồi đó." },
    { t:"out", text:"Jz bà nọi, sao có 99k z" },
    { t:"in",  text:"T góp hết tài sản của t cho m r đó" },
    { t:"nick", name:"nữ thần Momo", text:"Hiếu đã đổi biệt danh của Mẫn thành nữ thần Momo" },
  ]},
  { partner:"man", events:[
    { t:"in",  text:"Mai đi coi phim 0?" },
    { t:"out", text:"Hết tiền r :(. Cho ghi nợ nha, hihi" },
    { t:"in",  text:"Ok, z mai 12h30 Thám tử Kiên nha" },

/* ================= DOM refs ================= */

const introScreen=$("introScreen"), chatScreen=$("chatScreen"), endScreen=$("endScreen");
const headerAva=$("headerAva"), headerName=$("headerName"), headerStatus=$("headerStatus"), onlineDot=$("onlineDot");

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Runtime state ================= */
let runToken=0;
let activePartner=null;
let nicknames={};             // partner id -> display name override
let avatars={};               // partner id -> avatar override
let lastSender={man:null, shop:null};   // for message grouping
let lastRow={man:null, shop:null};
let fastForward=false;        // tap-to-skip flag, reset per event
let soundOn = localStorage.getItem("gm_sound") !== "off";
soundBtn.textContent = soundOn ? "🔊" : "🔇";

/* ================= Small utilities ================= */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const fmt = s => esc(s).replace(/\*(.*?)\*/g,"<em>$1</em>");
const plain = s => s.replace(/\*(.*?)\*/g,"$1");

let waitCancel=null;
function wait(ms){
  if (fastForward) return Promise.resolve();
  return new Promise(res=>{
    const t=setTimeout(()=>{waitCancel=null;res();},ms);
    waitCancel=()=>{clearTimeout(t);waitCancel=null;res();};
  });
}
chatBody.addEventListener("click", e=>{
  if (e.target.closest("img.media,video,a,button")) return;
  fastForward=true;
  if (waitCancel) waitCancel();
});

function scrollDown(){
  requestAnimationFrame(()=>{ chatBody.scrollTop = chatBody.scrollHeight; });
}

function partnerName(p){ return nicknames[p] || PARTNERS[p].name; }
function partnerAva(p){ return avatars[p] || PARTNERS[p].ava; }

/* ================= Sound (WebAudio pops) ================= */
let audioCtx=null;
function pop(kind){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==="suspended") audioCtx.resume();
    const t=audioCtx.currentTime;
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(kind==="send"?920:540, t);
    osc.frequency.exponentialRampToValueAtTime(kind==="send"?620:380, t+.11);
    g.gain.setValueAtTime(.09, t);
    g.gain.exponentialRampToValueAtTime(.001, t+.13);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t); osc.stop(t+.14);
  }catch(e){}
}
soundBtn.addEventListener("click", ()=>{
  soundOn=!soundOn;
  soundBtn.textContent = soundOn ? "🔊" : "🔇";
  localStorage.setItem("gm_sound", soundOn ? "on" : "off");
});

/* ================= Header / theme ================= */
function applyHeader(p, animateName){
  chatScreen.dataset.theme = p;
  headerAva.src = partnerAva(p);
  headerAva.alt = partnerName(p);
  if (animateName){
    headerName.classList.remove("flip"); void headerName.offsetWidth;
    headerName.classList.add("flip");
  }
  headerName.textContent = partnerName(p);
  headerStatus.textContent = PARTNERS[p].status;
  onlineDot.style.display = PARTNERS[p].online ? "block" : "none";
}

async function switchConversation(p){
  if (activePartner===p) return;
  if (activePartner){
    containers[activePartner].classList.remove("active");
    await wait(reducedMotion?0:260);
  }
  activePartner=p;
  applyHeader(p, false);
  containers[p].classList.add("active");
  scrollDown();
}

/* ================= Progress bar ================= */
for (let i=0;i<SCENES.length;i++){ progressBar.appendChild(document.createElement("i")); }
function setProgress(n){
  [...progressBar.children].forEach((seg,i)=>seg.classList.toggle("done", i<n));
}

/* ================= Message rendering ================= */
function breakGrouping(p){ lastSender[p]=null; lastRow[p]=null; }

function addRow(p, dir, node, sender){
  const box=containers[p];
  const row=document.createElement("div");
  row.className="row "+dir;
  if (dir==="in"){
    const side=document.createElement("div");
    side.className="side";
    row.appendChild(side);
  }
  row.appendChild(node);
  // grouping: adjust the previous bubble of the same run
  if (lastSender[p]===sender && lastRow[p]){
    const prev=lastRow[p];
    if (prev.classList.contains("g-last")){ prev.classList.replace("g-last","g-mid"); }
    else { prev.classList.add("g-first"); }
    row.classList.add("g-last");
    if (dir==="in"){ const pa=prev.querySelector(".side img"); if(pa) pa.remove(); }
  }
  if (dir==="in"){
    const img=document.createElement("img");
    img.src=partnerAva(p); img.alt="";
    row.querySelector(".side").appendChild(img);
  }
  lastSender[p]=sender; lastRow[p]=row;
  box.appendChild(row);
  scrollDown();
  return row;
}

function buildBubble(ev){
  const b=document.createElement("div");
  b.className="bubble";
  if (ev.text){
    const span=document.createElement("span");
    span.innerHTML=fmt(ev.text);
    b.appendChild(span);
  }
  if (ev.img){
    const im=document.createElement("img");
    im.className="media"; im.src=ev.img; im.loading="lazy";
    im.alt = ev.text ? plain(ev.text) : "Hình trong đoạn chat";
    im.addEventListener("load", scrollDown);
    im.addEventListener("click", ()=>{ lightboxImg.src=ev.img; lightbox.classList.add("show"); });
    b.appendChild(im);
    if(!ev.text) b.classList.add("media-only");
  }
  if (ev.video){
    const v=document.createElement("video");
    v.src=ev.video; v.controls=true; v.playsInline=true; v.preload="metadata";
    v.addEventListener("loadedmetadata", scrollDown);
    b.appendChild(v);
  }
  return b;
}

function attachReaction(row, emoji, run){
  setTimeout(()=>{
    if (run!==runToken) return;
    row.classList.add("has-react");
    const badge=document.createElement("span");
    badge.className="react-badge"; badge.textContent=emoji;
    row.querySelector(".bubble").appendChild(badge);
    pop("recv");
    scrollDown();
  }, reducedMotion?0:650);
}

function addCentered(p, cls, html){
  const el=document.createElement("div");
  el.className=cls; el.innerHTML=html;
  containers[p].appendChild(el);
  breakGrouping(p);
  scrollDown();
  return el;
}

/* typing indicator — built outside addRow so it never disturbs grouping */
function showTyping(p){
  const row=document.createElement("div");
  row.className="row in typing";
  row.innerHTML=`<div class="side"><img src="${partnerAva(p)}" alt=""></div>`+
                `<div class="bubble"><s></s><s></s><s></s></div>`;
  containers[p].appendChild(row);
  scrollDown();
  return row;
}

/* ================= Gates (user interaction points) ================= */
let pillResolve=null;
continuePill.addEventListener("click", ()=>{ if(pillResolve){const r=pillResolve;pillResolve=null;r();} });
function waitPill(label){
  continuePill.textContent=label||"Tiếp tục ▸";
  continuePill.classList.remove("hidden");
  return new Promise(res=>{ pillResolve=()=>{ continuePill.classList.add("hidden"); res(); }; });
}

let sendResolve=null;
sendBtn.addEventListener("click", ()=>{
  if (sendResolve){ const r=sendResolve; sendResolve=null; r(); }
});
function waitSend(){
  sendBtn.disabled=false; sendBtn.classList.add("ready");
  return new Promise(res=>{
    sendResolve=()=>{ sendBtn.disabled=true; sendBtn.classList.remove("ready"); res(); };
  });
}

/* ================= Event playback ================= */
function typingTime(text){
  return Math.max(650, Math.min(2400, (text?text.length:10)*34));
}

async function playIncoming(ev, run, isPayment){
  await wait(380); if(run!==runToken) return;
  const ind=showTyping(activePartner);
  await wait(typingTime(ev.text)); if(run!==runToken){ind.remove();return;}
  ind.remove();
  let node;
  if (isPayment){
    node=document.createElement("div");
    node.className="bubble media-only";
    node.innerHTML=`<div class="pay-card"><div class="pay-top">💸 ${esc(partnerName(activePartner))} đã chuyển tiền</div><div class="pay-amount">${esc(ev.amount)}</div><div class="pay-note">${fmt(ev.note||"")} · qua Momo</div></div>`;
  } else {
    node=buildBubble(ev);
  }
  const row=addRow(activePartner,"in",node, isPayment?"__pay__":activePartner);
  pop("recv");
  if (ev.react) attachReaction(row, ev.react, run);
}

async function typeIntoComposer(text, run){
  fakeInput.classList.add("typing-now");
  inputText.textContent="";
  const step=Math.max(12, Math.min(36, 950/Math.max(text.length,1)));
  for (let i=0;i<text.length;i++){
    if (run!==runToken) return;
    if (fastForward) break;
    inputText.textContent+=text[i];
    await wait(step);
  }
  inputText.textContent=text;
}

function clearComposer(){
  fakeInput.classList.remove("typing-now");
  inputText.textContent="";
  mediaChip.classList.remove("show");
  mediaChip.innerHTML="";
}

async function playOutgoing(ev, run){
  await wait(300); if(run!==runToken) return;
  if (ev.img || ev.video){
    mediaChip.innerHTML = ev.img
      ? `<img src="${ev.img}" alt=""> Đính kèm 1 ảnh 📷`
      : `🎬 Đính kèm 1 video`;
    mediaChip.classList.add("show");
  }
  await typeIntoComposer(plain(ev.text), run); if(run!==runToken) return;
  await waitSend(); if(run!==runToken) return;
  clearComposer();
  const row=addRow(activePartner, "out", buildBubble(ev), "hieu");
  pop("send");
  if (ev.video){
    const v=row.querySelector("video");
    if (v){ v.muted=false; v.play().catch(()=>{}); }
  }
  if (ev.react) attachReaction(row, ev.react, run);
}

async function playEvent(ev, run){
  fastForward=false;
  switch(ev.t){
    case "in":  await playIncoming(ev, run, false); break;
    case "pay": await playIncoming(ev, run, true);  break;
    case "out": await playOutgoing(ev, run); break;
    case "sys":
      await wait(600); if(run!==runToken) return;
      addCentered(activePartner,"sys",fmt(ev.text));
      break;
    case "narr":
      await wait(900); if(run!==runToken) return;
      addCentered(activePartner,"narrator",fmt(ev.text));
      break;
    case "seen":{
      await wait(1100); if(run!==runToken) return;
      const el=document.createElement("div");
      el.className="seen-row";
      el.innerHTML=`<span>Đã xem</span><img src="${partnerAva(activePartner)}" alt="">`;
      containers[activePartner].appendChild(el);
      breakGrouping(activePartner);
      scrollDown();
      if (ev.text) addCentered(activePartner,"sys",fmt("*"+ev.text+"*"));
      break;
    }
    case "nick":
      await wait(700); if(run!==runToken) return;
      nicknames[activePartner]=ev.name;
      addCentered(activePartner,"sys","✏️ "+esc(ev.text));
      applyHeader(activePartner, true);
      break;
    case "ava":
      await wait(700); if(run!==runToken) return;
      avatars[activePartner]=ev.img;
      addCentered(activePartner,"sys",
        `📷 ${esc(ev.text)}<img class="sys-ava" src="${ev.img}" alt="Ảnh đại diện mới">`);
      applyHeader(activePartner, false);
      break;
  }
}

/* ================= Main story loop ================= */
async function runStory(){
  const run=++runToken;
  for (let i=0;i<SCENES.length;i++){
    const scene=SCENES[i];
    if (i>0){
      await wait(500); if(run!==runToken) return;
      fastForward=false;
      await waitPill("Tiếp tục ▸"); if(run!==runToken) return;
    }
    setProgress(i+1);
    await switchConversation(scene.partner); if(run!==runToken) return;
    addCentered(scene.partner,"divider",
      `<b>Cảnh ${i+1}${scene.caption?" · "+esc(scene.caption):""}</b>`);
    for (const ev of scene.events){
      await playEvent(ev, run);
      if (run!==runToken) return;
    }
  }
  await wait(800); if(run!==runToken) return;
  fastForward=false;
  await waitPill("🎂 Bấm vô đây nè"); if(run!==runToken) return;
  showEnd();
}

/* ================= Screens ================= */
function showEnd(){
  endScreen.classList.remove("gone");
  chatScreen.classList.add("gone");
  startConfetti();
}

function resetAll(){
  runToken++;
  nicknames={}; avatars={};
  lastSender={man:null,shop:null}; lastRow={man:null,shop:null};
  activePartner=null;
  containers.man.innerHTML=""; containers.shop.innerHTML="";
  containers.man.classList.remove("active"); containers.shop.classList.remove("active");
  clearComposer();
  continuePill.classList.add("hidden"); pillResolve=null;
  sendBtn.disabled=true; sendBtn.classList.remove("ready"); sendResolve=null;
  setProgress(0);
  stopConfetti();
}

openBtn.addEventListener("click", ()=>{
  pop("send"); // also warms up the AudioContext inside the user gesture
  introScreen.classList.add("gone");

});

replayBtn.addEventListener("click", ()=>{
  endScreen.classList.add("gone");

  resetAll();

});

/* ================= Confetti ================= */
const canvas=$("confettiCanvas"), ctx=canvas.getContext("2d");
let confettiOn=false, pieces=[];
const COLORS=["#fff","#ffd166","#ff5e9c","#8ecae6","#b5e48c","#cdb4db"];
function newPiece(burst){
  return {
    x:Math.random()*canvas.width,
    y:burst? -20-Math.random()*canvas.height*.5 : -20,
    w:6+Math.random()*7, h:8+Math.random()*10,
    vy:1.6+Math.random()*2.6, vx:-1+Math.random()*2,
    rot:Math.random()*Math.PI, vr:-.12+Math.random()*.24,
    color:COLORS[Math.random()*COLORS.length|0],
    emoji:Math.random()<.12 ? ["🎂","💖","🎈","✨"][Math.random()*4|0] : null,
  };
}
function sizeCanvas(){
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=canvas.offsetHeight*devicePixelRatio;
}
function startConfetti(){
  if (reducedMotion) return;
  sizeCanvas();
  pieces=Array.from({length:140},()=>newPiece(true));
  confettiOn=true;
  requestAnimationFrame(tickConfetti);
}
function stopConfetti(){ confettiOn=false; pieces=[]; }
function tickConfetti(){
  if (!confettiOn) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (const p of pieces){
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
    if (p.y>canvas.height+30){ Object.assign(p,newPiece(false)); }
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    if (p.emoji){ ctx.font="18px serif"; ctx.fillText(p.emoji,-9,6); }
    else { ctx.fillStyle=p.color; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); }
    ctx.restore();
  }
  requestAnimationFrame(tickConfetti);
}
addEventListener("resize", ()=>{ if(confettiOn) sizeCanvas(); });
